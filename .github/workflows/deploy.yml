name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: ✅ Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"

      - name: Install dependencies
        run: vp i

      - name: Check
        run: vp check

      # The exports are built at release time, not committed, so there is
      # nothing to diff. Running the export still validates the KML: it throws
      # when a spot is missing a required tag axis.
      - name: Validate the map data
        run: vp run export

  deploy:
    name: ⚡️ Deploy to GitHub Pages
    needs: check
    # Pull requests get the checks but must not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "lts"

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: vp i

      - name: Build website
        run: vp build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
